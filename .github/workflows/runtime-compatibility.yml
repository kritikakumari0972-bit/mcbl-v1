name: Runtime compatibility policy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile runtime and APK-set safety policies
        run: |
          mkdir -p build/runtime-policy
          javac -d build/runtime-policy app/src/main/java/org/levimc/launcher/core/minecraft/BedrockRuntimeCompatibility.java scripts/BedrockRuntimeCompatibilitySmokeTest.java
          javac -d build/runtime-policy app/src/main/java/org/levimc/launcher/util/ApkSetValidator.java scripts/ApkSetValidatorSmokeTest.java

      - name: Run runtime compatibility smoke tests
        run: java -cp build/runtime-policy BedrockRuntimeCompatibilitySmokeTest

      - name: Run APK split-set validation smoke tests
        run: java -cp build/runtime-policy ApkSetValidatorSmokeTest
